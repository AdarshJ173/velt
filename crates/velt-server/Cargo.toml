[package]
name = "velt-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Zero-knowledge relay server for velt team sync"

[lib]
name = "velt_server"
path = "src/lib.rs"

[[bin]]
name = "velt-server"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
base64.workspace = true
hex.workspace = true
rand.workspace = true
sha2.workspace = true
uuid.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1.48", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "limit"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "migrate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dotenvy = "0.15"
ssh-key = { version = "0.6.7", features = ["ed25519"] }
futures-util = "0.3"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["rustls-tls-webpki-roots", "handshake"] }
postgresql_embedded = { version = "0.22", default-features = false, features = ["blocking", "zonky"] }
tempfile = "3.14"
