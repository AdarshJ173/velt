[package]
name = "velt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Local-first encrypted environment vault and process injector"

[[bin]]
name = "velt"
path = "src/main.rs"

[dependencies]
velt-core.workspace = true
clap = { version = "4.6", features = ["derive", "env", "string"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true
time.workspace = true
base64.workspace = true
hex.workspace = true
rand.workspace = true
dirs.workspace = true
tempfile.workspace = true
sha2.workspace = true
uuid.workspace = true
x25519-dalek.workspace = true
toml = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
tungstenite = { version = "0.30", default-features = false, features = ["rustls-tls-webpki-roots", "handshake", "url"] }
ratatui = "0.30"
crossterm = "0.29"
rpassword = "7.4"
signal-hook = "0.3"
ssh-key = { version = "0.6.7", features = ["ed25519", "encryption"] }
hmac.workspace = true
aho-corasick.workspace = true
percent-encoding.workspace = true
ed25519-dalek.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.14"
assert_cmd = "2.0"
predicates = "3.1"
velt-server = { path = "../velt-server" }
postgresql_embedded = { version = "0.22", default-features = false, features = ["blocking", "theseus", "tls-rustls-ring"] }
tokio = { version = "1.48", features = ["full"] }
axum = "0.8"
