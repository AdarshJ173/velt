name: release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: velt-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: velt-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: velt-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Set reproducible timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Build
        env:
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=/build"
        run: cargo build --release --locked --target ${{ matrix.target }} -p velt -p velt-server
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/${{ matrix.archive }}
          cp target/${{ matrix.target }}/release/velt dist/${{ matrix.archive }}/
          cp target/${{ matrix.target }}/release/velt-server dist/${{ matrix.archive }}/
          tar -C dist -czf dist/${{ matrix.archive }}.tar.gz ${{ matrix.archive }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/${{ matrix.archive }}" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/velt.exe" "dist/${{ matrix.archive }}/"
          Copy-Item "target/${{ matrix.target }}/release/velt-server.exe" "dist/${{ matrix.archive }}/"
          Compress-Archive -Path "dist/${{ matrix.archive }}" -DestinationPath "dist/${{ matrix.archive }}.zip"
      - uses: sigstore/cosign-installer@v3
      - name: Sign archive (keyless OIDC)
        shell: bash
        run: |
          for file in dist/*.tar.gz dist/*.zip; do
            [ -e "$file" ] || continue
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
      - name: Attest build provenance (Unix)
        if: runner.os != 'Windows'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/${{ matrix.archive }}.tar.gz
      - name: Attest build provenance (Windows)
        if: runner.os == 'Windows'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/${{ matrix.archive }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sigstore.json
          if-no-files-found: ignore
