name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install keychain and PostgreSQL test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config gnome-keyring dbus-x11 libsecret-tools
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: "Clippy (production paths: no unwrap/expect)"
        run: cargo clippy --workspace --lib --bins -- -D warnings -D clippy::unwrap_used -D clippy::expect_used
      - name: Build (locked)
        run: cargo build --workspace --locked
      - name: Tests (virtual Secret Service)
        run: |
          dbus-run-session -- bash -c '
            set -euo pipefail
            # --unlock only unlocks an existing login collection. A fresh
            # headless runner has none, so --login must create it first.
            printf "ci-test\n" | gnome-keyring-daemon --login --components=secrets
            # Secret Service creates the default collection on first write.
            printf seed | secret-tool store --label=velt-ci-seed service velt-ci
            cargo test --workspace --locked
          '
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install keychain build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Reproducible CLI build
        run: ./scripts/check-reproducible.sh
