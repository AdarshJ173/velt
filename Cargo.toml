[workspace]
resolver = "2"
members = ["crates/envy-core", "crates/envy-cli", "crates/envy-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["Adarsh Jagannath"]
repository = "https://github.com/AdarshJ173/envy"
homepage = "https://github.com/AdarshJ173/envy"
description = "Local-first, zero-config encrypted environment and secret vault for polyglot developers"

[workspace.dependencies]
envy-core = { path = "crates/envy-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
keyring = { version = "3.6", default-features = false, features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
regex = "1.11"
data-encoding = "2.6"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
hkdf = "0.12"
hmac = "0.12"
aho-corasick = "1.1"
percent-encoding = "2.3"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
fs2 = "0.4"
uuid = { version = "1.11", features = ["v4", "serde"] }
base64 = "0.22"
dirs = "6.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
